<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeShare</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Code Share <span id="status" class="status">Connecting...</span></h1>
      <div class="actions">
        <button id="btn-copy-code" class="secondary">Copy Code</button>
        <button id="btn-copy-link">Copy Room Link</button>
      </div>
    </header>
    <textarea id="code-editor" placeholder="Type here. Anyone with the link will see this live..."></textarea>
  </div>
</body>
</html>
