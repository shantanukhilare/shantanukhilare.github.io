<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Share — live, synced snippets</title>
    <meta
      name="description"
      content="Paste code, share the link, watch it sync live for anyone who opens it."
    />
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <div class="bg-ambient" aria-hidden="true">
      <div class="bg-aurora bg-aurora--a"></div>
      <div class="bg-aurora bg-aurora--b"></div>
      <div class="bg-grid"></div>
      <div class="bg-particles" id="bg-particles"></div>
    </div>

    <div class="container">
      <header>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 5 3 12l5 7" />
              <path d="M16 5l5 7-5 7" />
            </svg>
          </span>
          <h1>Code<span class="accent">Share</span></h1>
        </div>

        <div class="status-cluster">
          <span id="status" class="status status--connecting">
            <span class="status-dot"></span>
            <span class="status-label">Connecting…</span>
          </span>
          <button id="btn-room" class="chip" type="button" title="Copy room link">
            <span class="chip-label">room</span>
            <span id="room-id" class="chip-value"></span>
          </button>
        </div>

        <div class="actions">
          <button id="btn-paste-code" class="icon-btn secondary" type="button" title="Paste from clipboard">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="4" width="10" height="13" rx="1.5" />
              <path d="M8 4V3.2A1.2 1.2 0 0 1 9.2 2h1.6A1.2 1.2 0 0 1 12 3.2V4" />
              <path d="M7.5 9.5h5M7.5 12.5h5" />
            </svg>
            <span>Paste</span>
          </button>
          <button id="btn-cut-code" class="icon-btn secondary" type="button" title="Cut all code">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="5" cy="5" r="2.2" />
              <circle cx="5" cy="15" r="2.2" />
              <path d="M6.8 6.3 16 14M16 6 6.8 13.7" />
            </svg>
            <span>Cut</span>
          </button>
          <button id="btn-copy-code" class="icon-btn secondary" type="button" title="Copy all code">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="7" y="7" width="10" height="10" rx="2" />
              <path d="M4.5 13V4.5A1.5 1.5 0 0 1 6 3h8.5" />
            </svg>
            <span>Copy</span>
          </button>
          <button id="btn-copy-link" class="icon-btn" type="button" title="Copy room link">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8.3 11.7a3 3 0 0 0 4.24 0l2.1-2.1a3 3 0 0 0-4.24-4.25l-1 .95" />
              <path d="M11.7 8.3a3 3 0 0 0-4.24 0l-2.1 2.1a3 3 0 0 0 4.24 4.25l.98-.95" />
            </svg>
            <span>Share</span>
          </button>
        </div>
      </header>

      <main>
        <div class="editor-shell" id="editor-shell">
          <textarea id="code-editor" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
        </div>
        <div class="meta-bar">
          <span id="char-count">0 chars</span>
          <span class="dot-sep">·</span>
          <span id="line-count">1 line</span>
          <span class="meta-spacer"></span>
          <span class="meta-hint">Anyone with the link edits live</span>
        </div>
      </main>
    </div>
  </body>
</html>
